plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    alias libs.plugins.modDevGradle
    alias libs.plugins.lombok
}

String buildNumber = System.getenv("GITHUB_RUN_NUMBER")
def githubRef = System.getenv("GITHUB_REF")
def releaseVersion = System.getenv("MOD_VERSION")
if (releaseVersion != null && !releaseVersion.isBlank()) {
    // CI 进位点：显式覆盖为正式版 x.y（去掉末尾 0），由 ci.yml 注入
    version = releaseVersion
} else if (githubRef != null && githubRef.startsWith("refs/tags/")) {
    version = githubRef.substring(githubRef.lastIndexOf('/') + 1)
} else if (buildNumber != null) {
    // 相对 ci_start_run 计数：该运行号为 1.0.0，之后每次构建 +1（1.0.0 -> 1.0.9 -> 1.1.0 -> ...）
    int base = ci_start_run as int
    int k = buildNumber.toInteger() - base
    if (k < 0) k = 0
    version = "${1 + k.intdiv(100)}.${k.intdiv(10) % 10}.${k % 10}"
} else {
    version = mod_version
}
group = maven_group

apply from: "$rootDir/gradle/scripts/moddevgradle.gradle"
apply from: "$rootDir/gradle/scripts/repositories.gradle"
apply from: "$rootDir/gradle/scripts/jars.gradle"
apply from: "$rootDir/gradle/scripts/publishing.gradle"
apply from: "$rootDir/gradle/scripts/resources.gradle"
apply from: "$rootDir/dependencies.gradle"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources { srcDir 'src/generated/resources' }

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

lombok {
    version = "1.18.34"
}
